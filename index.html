<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>たんぽぽ図書館</title>
<meta name="description" content="医院にある図書の一覧・検索と、貸出（貸出日・借りた人・返却状況）を管理するサイト">
<link rel="icon" type="image/png" href="assets/logo-tanpopo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="#/">
      <img class="brand-mark" src="assets/logo-tanpopo.png" alt="" aria-hidden="true">
      <span class="brand-text">
        <span class="brand-title">たんぽぽ図書館</span>
      </span>
    </a>
    <div class="search-wrap">
      <label class="sr-only" for="search-input">キーワード検索</label>
      <input id="search-input" type="search" autocomplete="off"
             placeholder="タイトル・著者で検索">
      <button id="search-clear" type="button" aria-label="検索をクリア">&times;</button>
    </div>
  </div>
</header>

<div class="form-links">
  <a class="form-link form-link-loan" href="https://docs.google.com/forms/d/e/1FAIpQLSdJj40a9sNGseU0InMc5dWAcI2QWwFJl4m2juVu9RDnbazHvA/viewform" target="_blank" rel="noopener">
    📖 本を借りる
  </a>
  <a class="form-link form-link-return" href="https://docs.google.com/forms/d/e/1FAIpQLSeRwUKPJD6P2Zq0xQ11YYIkvZOPdC6PMvAG_9GPU78xO5GS3A/viewform" target="_blank" rel="noopener">
    📗 本を返す
  </a>
</div>

<div class="rules-box">
  <h2 class="rules-title">📌 貸出ルール</h2>
  <ul class="rules-list">
    <li>返却の際は、本棚に戻さず、返却BOXに戻してください。</li>
    <li>貸出期間は１週間です。</li>
    <li>長く借りたい、こんな本が欲しい等なにかありましたら図書係まで。</li>
  </ul>
</div>

<main class="layout">
  <p id="result-count" class="result-count" role="status" aria-live="polite"></p>

  <ul id="book-list" class="book-list"></ul>

  <p id="empty-state" class="empty-state" hidden>
    該当する本が見つかりませんでした。別のキーワードで検索してください。
  </p>
</main>

<div id="cover-overlay" class="cover-overlay" hidden>
  <div class="cover-panel" role="dialog" aria-modal="true" aria-labelledby="cover-title">
    <button id="cover-close" class="cover-close" type="button" aria-label="閉じる">&times;</button>
    <img id="cover-image" class="cover-image-large" src="" alt="">
    <div class="cover-info">
      <span id="cover-no" class="book-no"></span>
      <h2 id="cover-title" class="book-title"></h2>
      <p id="cover-published" class="book-published" hidden></p>
      <p id="cover-author" class="book-author" hidden></p>
    </div>
  </div>
</div>

<footer class="site-footer">
  <p>院内向け 図書管理サイト &mdash; データは <code>data/books.json</code> を編集して更新できます。</p>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
